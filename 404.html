<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found - iNeuBytes</title>
    <style>
        body { background:#f5f6fb; color:#201f42; font-family:Arial,Helvetica,sans-serif; margin:0; }
        .not-found { align-items:center; display:flex; justify-content:center; min-height:100vh; padding:24px; text-align:center; }
        .not-found-card { background:#fff; border:1px solid #e5e7f0; border-radius:14px; box-shadow:0 12px 35px rgba(32,31,66,.08); max-width:560px; padding:48px 32px; width:100%; }
        h1 { color:#ff7110; font-size:72px; margin:0 0 8px; }
        h2 { margin:0 0 12px; }
        p { color:#666b80; line-height:1.6; margin:0 0 24px; }
        a { background:#201f42; border-radius:24px; color:#fff; display:inline-block; padding:12px 24px; text-decoration:none; }
    </style>
</head>
<body>
    <main class="not-found">
        <section class="not-found-card">
            <h1>404</h1>
            <h2>Page not found</h2>
            <p>The page you requested is unavailable or may have moved.</p>
            <a href="https://ineubytes.com">Return to iNeuBytes</a>
        </section>
    </main>
</body>
</html>
